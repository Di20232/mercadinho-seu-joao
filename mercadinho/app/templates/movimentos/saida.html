{% extends "base.html" %}
{% block titulo %}Saiu do estoque — Mercadinho{% endblock %}
{% block conteudo %}
<h1 class="h5 mt-3 mb-1">Saiu do estoque</h1>
<p class="text-muted small">Vendeu no balcão ou tirou da gôndola? Registre aqui.</p>

<form method="post" class="card card-body shadow-sm border-0">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% with id_sufixo = 'saida' %}{% include "movimentos/_seletor.html" %}{% endwith %}

  <label class="form-label" for="quantidade">2. Quanto saiu?</label>
  <div class="input-group input-group-lg mb-3">
    <button class="btn btn-outline-secondary" type="button" data-passo="-1">−</button>
    <input class="form-control text-center" id="quantidade" name="quantidade" inputmode="decimal"
           value="1" data-campo-quantidade required>
    <button class="btn btn-outline-secondary" type="button" data-passo="1">+</button>
    <span class="input-group-text" data-unidade>un</span>
  </div>

  <label class="form-label" for="observacao">Alguma observação? <span class="text-muted">(opcional)</span></label>
  <input class="form-control mb-3" id="observacao" name="observacao" placeholder="Ex.: venda do balcão">

  <button class="btn btn-verde btn-lg">Confirmar saída</button>
</form>
{% endblock %}
