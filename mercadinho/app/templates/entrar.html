{% extends "base.html" %}
{% block titulo %}Entrar — Mercadinho do Seu João{% endblock %}
{% block conteudo %}
<div class="tela-login">
  <div class="text-center mb-4">
    <div class="logo-grande">🛒</div>
    <h1 class="h4 mt-2 mb-1">Mercadinho do Seu João</h1>
    <p class="text-muted mb-0">Controle de estoque</p>
  </div>

  <form method="post" class="card card-body shadow-sm">
    <label class="form-label" for="login">Seu usuário</label>
    <input class="form-control form-control-lg mb-3" id="login" name="login"
           autocomplete="username" autocapitalize="none" required autofocus>

    <label class="form-label" for="senha">Sua senha</label>
    <div class="input-group input-group-lg mb-3">
      <input class="form-control" id="senha" name="senha" type="password"
             autocomplete="current-password" required>
      <button class="btn btn-outline-secondary" type="button" data-ver-senha="#senha" aria-label="Mostrar senha">
        <i class="bi bi-eye"></i>
      </button>
    </div>

    <button class="btn btn-verde btn-lg w-100">Entrar</button>
  </form>
</div>
{% endblock %}
