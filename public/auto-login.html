<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contro Vend — Autenticação</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 8px;
      padding: 40px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      max-width: 400px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: #333;
      margin: 0 0 10px 0;
      font-size: 28px;
    }
    .subtitle {
      color: #666;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .status {
      color: #666;
      font-size: 14px;
      margin: 20px 0;
    }
    .status.success {
      color: #4caf50;
      font-weight: bold;
    }
    .status.error {
      color: #f44336;
      font-weight: bold;
    }
    .credentials {
      background: #f5f5f5;
      border-left: 4px solid #667eea;
      padding: 15px;
      margin-top: 20px;
      text-align: left;
      border-radius: 4px;
      font-size: 13px;
    }
    .credentials p {
      margin: 5px 0;
      color: #333;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Contro Vend</h1>
    <p class="subtitle">Autenticando automaticamente...</p>

    <div class="loader"></div>
    <p class="status" id="status">Conectando ao servidor...</p>

    <div class="credentials">
      <p><strong>Credenciais:</strong></p>
      <p>📧 Email: <code>adm@adm.com.br</code></p>
      <p>🔑 Senha: <code>adm12345</code></p>
    </div>
  </div>

  <script>
    async function autoLogin() {
      try {
        document.getElementById('status').textContent = 'Enviando credenciais...';

        const response = await fetch('http://localhost:3000/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Requested-With': 'fetch',
          },
          credentials: 'include',
          body: JSON.stringify({
            email: 'adm@adm.com.br',
            password: 'adm12345'
          })
        });

        const data = await response.json();

        if (response.ok) {
          document.getElementById('status').textContent = '✅ Login realizado! Redirecionando...';
          document.getElementById('status').className = 'status success';

          setTimeout(() => {
            window.location.href = 'http://localhost:3000/app.html';
          }, 1500);
        } else {
          throw new Error(data.error || 'Erro ao fazer login');
        }
      } catch (error) {
        console.error('Erro:', error);
        document.getElementById('status').textContent = '❌ ' + error.message;
        document.getElementById('status').className = 'status error';

        // Tentar novamente após 3 segundos
        setTimeout(autoLogin, 3000);
      }
    }

    // Iniciar login quando a página carregar
    window.addEventListener('load', autoLogin);
  </script>
</body>
</html>
