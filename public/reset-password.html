<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="referrer" content="no-referrer" />
  <title>Contro Vend — Redefinir senha</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="login-wrap">
    <form id="reset-form" class="card login-card">
      <div class="brand-mark" aria-hidden="true">CV</div>
      <h1>Redefinir senha</h1>
      <p class="muted">Escolha uma nova senha para sua conta.</p>

      <label for="password">Nova senha</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="200" />

      <label for="confirm">Confirme a nova senha</label>
      <input id="confirm" name="confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="200" />

      <button type="submit">Redefinir senha</button>
      <p id="reset-msg" class="error" role="alert" hidden></p>

      <div class="login-links">
        <a href="/index.html" class="link-action">Voltar para o login</a>
      </div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/reset-password.js"></script>
</body>
</html>
