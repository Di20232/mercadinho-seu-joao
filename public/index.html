<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mercadinho do João — Entrar</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <main class="login-wrap">
    <form id="login-form" class="card login-card" novalidate>
      <div class="brand-mark" aria-hidden="true">MJ</div>
      <h1>Mercadinho do João</h1>
      <p class="muted">Sistema de vendas e estoque</p>

      <label for="email">E-mail</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="255" />

      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required maxlength="200" />

      <button type="submit">Entrar</button>
      <p id="login-error" class="error" role="alert" hidden></p>

      <div class="login-links">
        <a href="/recuperar-senha.html" class="link-action">Esqueci minha senha</a>
        <a href="/cadastro.html" class="link-action">Cadastre-se</a>
      </div>
    </form>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
